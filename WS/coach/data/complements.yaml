hummus: {ingredient: hummus, grams: 50, label: "2 c. à soupe de houmous", slots: [snack]}
oats: {ingredient: oats, grams: 30, label: "30 g de flocons d'avoine", slots: [breakfast]}
rice_cakes: {ingredient: rice_cakes, grams: 16, label: "2 galettes de riz soufflé", slots: [snack]}
oil_drizzle: {ingredient: rapeseed_oil, grams: 10, label: "1 c. à soupe d'huile en filet, d'olive, de colza ou de sésame selon le plat", slots: [lunch, dinner]}
