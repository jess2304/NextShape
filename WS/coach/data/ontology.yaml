# Vocabulary of the food profile.
#
# Allergens follow Annex II of Regulation (EU) No 1169/2011.
# Labels and synonyms are French: labels are shown to users, synonyms are
# matched against what they type, without accents or case.

allergens:
  gluten:
    label: Céréales contenant du gluten
    synonyms: [gluten, ble, froment, seigle, orge, avoine, epeautre, kamut, celiaque, maladie coeliaque]
    children:
      ble: {label: Blé, synonyms: [ble, froment, epeautre, kamut, semoule de ble]}
      seigle: {label: Seigle, synonyms: [seigle]}
      orge: {label: Orge, synonyms: [orge]}
      avoine: {label: Avoine, synonyms: [avoine, flocons d avoine]}
  crustaceans:
    label: Crustacés
    synonyms: [crustace, crustaces, crevette, crevettes, crabe, homard, langouste, langoustine, gambas, ecrevisse]
  eggs:
    label: Œufs
    synonyms: [oeuf, oeufs, egg, eggs, blanc d oeuf, jaune d oeuf]
  fish:
    label: Poissons
    synonyms: [poisson, poissons, fish]
  peanuts:
    label: Arachides
    synonyms: [arachide, arachides, cacahuete, cacahuetes, cacahuette, cacahuettes, cacahouete, cacahouetes, beurre de cacahuete, peanut, peanuts]
  soy:
    label: Soja
    synonyms: [soja, soya, soy, tofu, tempeh, edamame]
  milk:
    label: Lait
    synonyms: [lait, produits laitiers, laitage, laitages, proteines de lait, plv, apl, lait de vache, dairy]
  nuts:
    label: Fruits à coque
    synonyms: [fruits a coque, fruit a coque, noix (toutes), nuts, tree nuts]
    children:
      amande: {label: Amande, synonyms: [amande, amandes, poudre d amande, lait d amande]}
      noisette: {label: Noisette, synonyms: [noisette, noisettes]}
      noix: {label: Noix, synonyms: [noix, cerneaux de noix, noix de grenoble]}
      cajou: {label: Noix de cajou, synonyms: [cajou, noix de cajou, anacarde]}
      pecan: {label: Noix de pécan, synonyms: [pecan, noix de pecan]}
      bresil: {label: Noix du Brésil, synonyms: [noix du bresil]}
      pistache: {label: Pistache, synonyms: [pistache, pistaches]}
      macadamia: {label: Macadamia, synonyms: [macadamia, noix de macadamia]}
  celery:
    label: Céleri
    synonyms: [celeri, celeri branche, celeri rave]
  mustard:
    label: Moutarde
    synonyms: [moutarde]
  sesame:
    label: Sésame
    synonyms: [sesame, tahin, tahini, graines de sesame]
  sulphites:
    label: Sulfites
    synonyms: [sulfite, sulfites, sulphite, sulphites, anhydride sulfureux]
  lupin:
    label: Lupin
    synonyms: [lupin]
  molluscs:
    label: Mollusques
    synonyms: [mollusque, mollusques, moule, moules, huitre, huitres, palourde, palourdes, calamar, calamars, encornet, poulpe, seiche, coquille saint jacques, saint jacques]

# Synonym groups that cover several allergens.
allergen_groups:
  fruits_de_mer: {label: Fruits de mer (crustacés et mollusques), synonyms: [fruits de mer, fruit de mer, seafood], allergens: [crustaceans, molluscs]}

# Diets: the animal origins each diet forbids. Flexitarian caps meat meals per week.
diets:
  omnivore: {label: Omnivore, forbid: []}
  flexitarian: {label: Flexitarien, forbid: [], meat_meals_max: 4}
  pescetarian: {label: Pescétarien, forbid: [poultry, beef, veal, pork, lamb]}
  vegetarian: {label: Végétarien, forbid: [poultry, beef, veal, pork, lamb, fish, crustacean, mollusc]}
  vegan: {label: Végétalien (vegan), forbid: [poultry, beef, veal, pork, lamb, fish, crustacean, mollusc, egg, dairy, honey]}

# Religious or medical restrictions. `implies` pulls in other restrictions.
restrictions:
  no_pork: {label: Sans porc, synonyms: [sans porc], forbid_animals: [pork]}
  no_alcohol: {label: Sans alcool en cuisine, synonyms: [sans alcool, alcool], forbid_alcohol: true}
  halal: {label: Halal, synonyms: [halal, hallal], implies: [no_pork, no_alcohol], note: "Choisissez une viande certifiée halal à l'achat."}
  kosher: {label: Casher, synonyms: [casher, cacher, kasher, kosher], implies: [no_pork], forbid_animals: [crustacean, mollusc], forbid_meat_with_dairy: true, note: "Choisissez des produits certifiés casher à l'achat."}
  no_beef: {label: Sans bœuf, synonyms: [sans boeuf], forbid_animals: [beef, veal]}
  lactose: {label: Intolérance au lactose, synonyms: [lactose, sans lactose, intolerance au lactose, intolerant au lactose], forbid_lactose: true}

# Food-safety precautions derived from the health profile, never typed by users.
# Source: Manger Bouger (Santé publique France), "Quels aliments éviter et
# quelles précautions prendre quand on est enceinte ?". Raw, smoked or
# undercooked dishes carry "cautions: [pregnancy]" in their recipe; this section
# holds what applies whatever the dish: alcohol, soy-based foods (soy sauce stays
# allowed) and fish to limit to one meal a week.
cautions:
  pregnancy:
    label: Grossesse
    forbid_alcohol: true
    forbid_ingredients: [soy_drink, soy_yogurt, soy_cream, tofu, tofu_silken, tofu_smoked, tempeh, tvp, miso]
    weekly_max: {ingredients: [tuna_fresh, tuna_canned, sea_bream], meals: 1}
    note: "Grossesse : ce programme exclut l'alcool, les aliments à base de soja et les plats de poisson cru ou fumé, de charcuterie crue, d'œuf peu cuit ou de crevettes cuites servies froides ; thon et dorade sont limités à un repas par semaine. Choisissez des fromages pasteurisés, râpez-les vous-même et retirez-en la croûte, lavez soigneusement fruits, légumes et herbes, et cuisez bien viandes, poissons et œufs."
  breastfeeding:
    label: Allaitement
    forbid_alcohol: true
    forbid_ingredients: [soy_drink, soy_yogurt, soy_cream, tofu, tofu_silken, tofu_smoked, tempeh, tvp, miso]
    note: "Allaitement : pas d'alcool ni d'aliments à base de soja dans ce programme (la sauce soja reste possible de temps en temps)."

