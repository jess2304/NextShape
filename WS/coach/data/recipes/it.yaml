# Italy. Quantities for one reference portion.

- id: it_spaghetti_bolognaise
  title: Spaghetti à la bolognaise
  meta: {country: IT, slots: [lunch, dinner], time: [20, 60], level: 1, spice: 0, equipment: [cocotte, casserole], keeps: 3, freezes: true, leftovers: true}
  items: [[beef_mince, 120, protein], [pasta, 85, starch], [tomato_passata, 150, sauce], [carrot, 50, veg], [onion, 50, veg],
          [celery, 30, veg], [olive_oil, 8, fat], [garlic, 5, flavor], [parmesan, 10, flavor], [basil, 5, flavor]]
  steps:
  - Hacher finement l'oignon, la carotte et le céleri ; les faire revenir 8 minutes dans l'huile avec l'ail.
  - Ajouter la viande et la faire colorer en l'émiettant.
  - Verser le coulis de tomate et laisser mijoter 40 minutes à feu doux, à couvert.
  - Cuire les spaghetti al dente et servir avec la sauce, le parmesan et le basilic.

- id: it_pasta_fagioli
  title: Pasta e fagioli au romarin
  meta: {country: IT, slots: [lunch, dinner], time: [15, 35], level: 1, spice: 0, equipment: [cocotte], keeps: 3, freezes: true, leftovers: true}
  items: [[white_beans, 150, protein], [pasta, 60, starch], [tomato_canned, 120, sauce], [onion, 50, veg], [carrot, 50, veg],
          [celery, 30, veg], [olive_oil, 10, fat], [garlic, 5, flavor], [rosemary, 2, flavor]]
  steps:
  - Faire revenir l'oignon, la carotte, le céleri et l'ail dans l'huile avec le romarin.
  - Ajouter les tomates, les haricots et 40 cl d'eau ; mijoter 15 minutes.
  - Écraser une partie des haricots pour épaissir, puis cuire les petites pâtes dans la soupe 10 minutes.
  - Servir avec un filet d'huile d'olive.

- id: it_risotto_champignons
  title: Risotto aux champignons et petits pois
  meta: {country: IT, slots: [lunch, dinner], time: [30, 35], level: 2, spice: 0, equipment: [cocotte, poele], keeps: 1}
  items: [[parmesan, 20, protein], [rice, 80, starch], [mushroom, 150, veg], [peas, 60, veg], [onion, 40, veg], [wine_white, 40, sauce],
          [butter, 8, fat], [olive_oil, 5, fat], [stock_veg, 5, flavor], [parsley, 5, flavor]]
  steps:
  - Faire sauter les champignons émincés dans l'huile, réserver.
  - Nacrer le riz avec l'oignon dans la moitié du beurre, puis déglacer au vin blanc.
  - Ajouter le bouillon chaud louche par louche pendant 18 minutes en remuant, avec les petits pois à mi-cuisson.
  - Hors du feu, incorporer les champignons, le reste de beurre, le parmesan et le persil.

- id: it_penne_arrabbiata
  title: Penne all'arrabbiata
  meta: {country: IT, slots: [lunch, dinner], time: [10, 20], level: 1, spice: 2, equipment: [casserole, poele], keeps: 2}
  items: [[pasta, 100, starch], [tomato_canned, 200, sauce], [olive_oil, 10, fat], [garlic, 5, flavor], [chili_flakes, 0.5, flavor], [parsley, 5, flavor]]
  steps:
  - Faire chauffer l'ail et le piment dans l'huile sans les brûler.
  - Ajouter les tomates écrasées et laisser réduire 12 minutes.
  - Cuire les penne al dente, les mélanger à la sauce et parsemer de persil.

- id: it_pollo_cacciatora
  title: Poulet chasseur à l'italienne et polenta
  meta: {country: IT, slots: [lunch, dinner], time: [20, 50], level: 1, spice: 0, equipment: [cocotte, casserole], keeps: 3, freezes: true, leftovers: true}
