  - Préchauffer le four à 250 °C avec la plaque à l'intérieur.
  - Étaler la pâte finement, la napper de coulis puis de mozzarella en morceaux.
  - Cuire 10 à 12 minutes sur la plaque très chaude.
  - Garnir de basilic, de roquette et d'un filet d'huile d'olive.

- id: it_gnocchi_sorrentina
  title: Gnocchis à la sorrentine
  meta: {country: IT, slots: [lunch, dinner], time: [10, 25], level: 1, spice: 0, equipment: [casserole, four], keeps: 1}
