- id: it_cotoletta
  title: Escalope de poulet milanaise, roquette et tomates cerises
  meta: {country: IT, slots: [lunch, dinner], time: [20, 35], level: 1, spice: 0, equipment: [poele, casserole], keeps: 0}
  items: [[chicken_breast, 130, protein], [egg, 25, protein], [breadcrumbs, 25, starch], [potato, 150, starch], [arugula, 40, veg],
          [cherry_tomato, 120, veg], [flour, 8, flavor], [sunflower_oil, 15, fat], [lemon_juice, 10, flavor]]
  steps:
  - Cuire les pommes de terre 20 minutes à l'eau salée.
  - Aplatir le poulet, le passer dans la farine, l'œuf battu puis la chapelure.
  - Le dorer 3 à 4 minutes par face dans l'huile chaude.
  - Servir avec la roquette, les tomates cerises, les pommes de terre et un quartier de citron.

- id: it_spaghetti_crevettes
  title: Spaghetti aglio, olio e peperoncino aux crevettes
  meta: {country: IT, slots: [lunch, dinner], time: [15, 20], level: 1, spice: 1, equipment: [casserole, poele], keeps: 0}
  items: [[shrimp, 120, protein], [pasta, 85, starch], [cherry_tomato, 100, veg], [olive_oil, 15, fat], [garlic, 8, flavor],
          [chili_flakes, 0.5, flavor], [parsley, 6, flavor], [lemon_juice, 10, flavor]]
  steps:
  - Cuire les spaghetti al dente dans une grande quantité d'eau salée.
  - Faire chauffer doucement l'huile avec l'ail émincé et le piment, sans laisser brunir l'ail.
  - Ajouter les crevettes et les tomates cerises ; cuire 3 minutes.
  - Mélanger avec les pâtes, un peu d'eau de cuisson, le persil et le citron.

- id: it_caprese
  title: Salade caprese, roquette et pain de campagne
  meta: {country: IT, slots: [lunch, dinner], time: [10, 10], level: 1, spice: 0, equipment: [aucun], keeps: 0}
  items: [[mozzarella, 100, protein], [bread_country, 70, starch], [tomato, 200, veg], [arugula, 30, veg], [olive_oil, 12, fat],
          [basil, 4, flavor], [vinegar, 5, flavor]]
  steps:
  - Trancher les tomates et la mozzarella et les alterner dans l'assiette.
  - Ajouter la roquette et le basilic, puis assaisonner d'huile et de vinaigre.
  - Servir avec le pain.

- id: it_frittata_epinards
  title: Frittata aux épinards et à la ricotta
  meta: {country: IT, slots: [breakfast, lunch, dinner], time: [10, 25], level: 1, spice: 0, equipment: [poele, four], keeps: 1}
  items: [[egg, 150, protein], [ricotta, 50, protein], [bread_country, 50, starch], [spinach, 150, veg], [parmesan, 10, flavor],
          [olive_oil, 8, fat], [nutmeg, 0.2, flavor]]
  steps:
  - Faire tomber les épinards dans l'huile, dans une poêle allant au four.
  - Battre les œufs avec la ricotta, le parmesan et la muscade, puis verser sur les épinards.
  - Cuire 5 minutes à feu doux, puis finir 8 minutes au four à 180 °C, jusqu'à ce que la frittata soit bien prise.
  - Servir avec le pain.

- id: it_tartine_ricotta_peches
  title: Tartines de ricotta, pêches et miel
  meta: {country: IT, slots: [breakfast], time: [5, 5], level: 1, spice: 0, equipment: [aucun], keeps: 0}
  items: [[ricotta, 80, protein], [bread_whole, 70, starch], [peach, 150, fruit], [honey, 10, flavor]]
  steps:
  - Faire griller le pain si vous le souhaitez, puis le tartiner de ricotta.
  - Ajouter les pêches en lamelles et un filet de miel.

- id: it_focaccia
  title: Focaccia au romarin et tomates cerises
  meta: {country: IT, slots: [snack], time: [10, 30], level: 1, spice: 0, equipment: [four], keeps: 2}
  items: [[pizza_dough, 80, starch], [cherry_tomato, 50, veg], [olive_oil, 8, fat], [rosemary, 1, flavor]]
  steps:
  - Étaler la pâte sur 1,5 cm d'épaisseur et y enfoncer les doigts pour former des creux.
  - Garnir de tomates cerises coupées en deux et de romarin, puis arroser d'huile.
  - Cuire 18 minutes au four à 220 °C.

- id: it_pomme_parmesan
  title: Pomme et copeaux de parmesan
  meta: {country: IT, slots: [snack], time: [2, 2], level: 1, spice: 0, equipment: [aucun], keeps: 0}
  items: [[apple, 150, fruit], [parmesan, 20, protein]]
  steps:
  - Couper la pomme en fines tranches.
  - Accompagner de copeaux de parmesan.

- id: it_polenta_lenticchie
  title: Polenta et ragoût de lentilles aux légumes
  meta: {country: IT, slots: [lunch, dinner], time: [20, 45], level: 1, spice: 0, equipment: [cocotte, casserole], keeps: 3, freezes: true, leftovers: true}
  items: [[lentils_green, 70, protein], [polenta, 60, starch], [carrot, 70, veg], [celery, 40, veg], [onion, 50, veg], [tomato_passata, 150, sauce],
          [olive_oil, 12, fat], [garlic, 4, flavor], [rosemary, 0.5, flavor], [bay_leaf, 0.2, flavor]]
  steps:
  - Faire revenir l'oignon, la carotte et le céleri en petits dés dans l'huile 8 minutes.
  - Ajouter l'ail, les lentilles rincées, la sauce tomate, le romarin, le laurier et 50 cl d'eau ; mijoter 30 minutes.
  - Cuire la polenta dans quatre fois son volume d'eau salée en remuant, 5 à 8 minutes.
  - Servir le ragoût de lentilles sur la polenta.
