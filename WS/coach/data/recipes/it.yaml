  - Dorer le poulet dans l'huile, ajouter l'oignon, l'ail, le poivron et le romarin.
  - Verser les tomates, ajouter les olives et mijoter 30 minutes à couvert.
  - Cuire la polenta dans quatre fois son volume d'eau salée en remuant 5 à 8 minutes.
  - Servir le poulet et sa sauce sur la polenta.

- id: it_pesto_genovese
  title: Trofie au pesto, pommes de terre et haricots verts
  meta: {country: IT, slots: [lunch, dinner], time: [10, 20], level: 1, spice: 0, equipment: [casserole], keeps: 1}
  items: [[pasta, 80, starch], [potato, 80, starch], [green_beans, 80, veg], [pesto, 25, sauce], [parmesan, 10, protein]]
  steps:
  - Cuire les pommes de terre en petits dés dans l'eau bouillante salée 5 minutes.
  - Ajouter les pâtes puis les haricots verts coupés, et cuire le tout jusqu'à ce que les pâtes soient al dente.
  - Égoutter en gardant un peu d'eau de cuisson, mélanger avec le pesto et le parmesan.

