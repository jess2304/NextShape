- id: us_chili_patate_douce
  title: Chili de patate douce et haricots noirs
  meta: {country: US, slots: [lunch, dinner], time: [15, 40], level: 1, spice: 2, equipment: [cocotte], keeps: 4, freezes: true, leftovers: true}
  items: [[black_beans, 180, protein], [sweet_potato, 200, starch], [tomato_canned, 150, sauce], [onion, 50, veg], [bell_pepper_red, 60, veg],
          [olive_oil, 8, fat], [cumin, 1, flavor], [paprika, 2, flavor], [chili_flakes, 0.3, flavor], [lime_juice, 10, flavor], [cilantro, 5, flavor]]
  steps:
  - Faire revenir l'oignon et le poivron dans l'huile avec les épices.
  - Ajouter la patate douce en cubes, les tomates et 15 cl d'eau ; mijoter 20 minutes.
  - Ajouter les haricots, cuire 10 minutes.
  - Finir avec le citron vert et la coriandre.

- id: fr_salade_lentilles_betterave
  title: Salade de lentilles, betterave, noix et roquette
  meta: {country: FR, slots: [lunch, dinner], time: [15, 35], level: 1, spice: 0, equipment: [casserole], keeps: 3, leftovers: true}
  items: [[lentils_green, 70, protein], [potato, 150, starch], [beetroot, 150, veg], [arugula, 40, veg], [red_onion, 20, veg], [walnuts, 15, fat],
          [olive_oil, 8, fat], [cider_vinegar, 10, flavor], [mustard, 5, flavor]]
  steps:
  - Cuire les lentilles 25 minutes et les pommes de terre en cubes 15 minutes.
  - Préparer une vinaigrette moutarde, vinaigre et huile.
  - Mélanger lentilles, pommes de terre, betterave en dés, oignon et roquette.
  - Parsemer de noix concassées.

- id: it_risotto_quinoa_champignons
  title: Quinoa crémeux aux champignons et petits pois
  meta: {country: IT, slots: [lunch, dinner], time: [15, 25], level: 1, spice: 0, equipment: [casserole, poele], keeps: 2}
  items: [[peas, 100, protein], [white_beans, 100, protein], [quinoa, 65, starch], [mushroom, 200, veg], [onion, 40, veg],
          [olive_oil, 10, fat], [garlic, 5, flavor], [thyme, 0.5, flavor], [parsley, 5, flavor]]
  steps:
  - Cuire le quinoa 12 minutes avec l'oignon haché.
  - Poêler les champignons avec l'ail et le thym dans l'huile.
  - Écraser la moitié des haricots blancs avec un peu d'eau chaude pour faire une crème.
  - Mélanger quinoa, crème de haricots, haricots entiers, petits pois et champignons ; parsemer de persil.

- id: fr_ratatouille_quinoa
  title: Ratatouille aux pois chiches et quinoa
  meta: {country: FR, slots: [lunch, dinner], time: [25, 60], level: 1, spice: 0, equipment: [cocotte, casserole], keeps: 4, freezes: true, leftovers: true}
  items: [[chickpeas, 150, protein], [quinoa, 55, starch], [zucchini, 150, veg], [eggplant, 150, veg], [bell_pepper_red, 100, veg], [tomato, 150, veg],
          [onion, 60, veg], [olive_oil, 10, fat], [garlic, 5, flavor], [herbes_provence, 1, flavor]]
  steps:
  - Faire revenir l'oignon et l'ail dans l'huile, ajouter les légumes en dés et les herbes.
  - Mijoter 35 minutes à couvert, ajouter les pois chiches 10 minutes avant la fin.
  - Servir avec le quinoa.

