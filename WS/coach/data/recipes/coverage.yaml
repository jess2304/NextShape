# Batch written to fill coverage gaps: gluten-free, vegan and nut-free
# breakfasts and snacks, and gluten-free vegan dishes.

- id: us_chia_pudding_mangue
  title: Pudding de chia au lait de soja et mangue
  meta: {country: US, slots: [breakfast], time: [5, 240], level: 1, spice: 0, equipment: [aucun], keeps: 3}
  items: [[soy_drink, 200, protein], [chia, 25, fat], [mango, 120, fruit], [maple_syrup, 8, flavor]]
  steps:
  - Mélanger les graines de chia avec la boisson au soja et le sirop d'érable.
  - Laisser prendre au moins 4 heures au réfrigérateur, en remuant une fois après 10 minutes.
  - Servir avec la mangue en dés.

- id: fr_chia_amande_fruits_rouges
  title: Pudding de chia au lait d'amande et framboises
  meta: {country: FR, slots: [breakfast], time: [5, 240], level: 1, spice: 0, equipment: [aucun], keeps: 3}
  items: [[almond_drink, 200, protein], [chia, 25, fat], [raspberry, 100, fruit], [pumpkin_seeds, 10, fat], [maple_syrup, 8, flavor]]
  steps:
  - Mélanger les graines de chia avec la boisson à l'amande et le sirop d'érable.
  - Laisser prendre au moins 4 heures au réfrigérateur.
  - Servir avec les framboises et les graines de courge.

- id: fr_galette_sarrasin_oeuf
  title: Galette de sarrasin à l'œuf et aux tomates
  meta: {country: FR, slots: [breakfast], time: [10, 10], level: 1, spice: 0, equipment: [poele], keeps: 0, cautions: [pregnancy]}
  items: [[egg, 100, protein], [buckwheat_galette, 55, starch], [cherry_tomato, 100, veg], [butter, 4, fat], [chives, 5, flavor]]
  steps:
  - Chauffer la galette dans une poêle légèrement beurrée.
  - Casser les œufs au centre, couvrir 3 minutes.
  - Replier les bords et servir avec les tomates cerises et la ciboulette.

- id: us_tofu_patate_douce
  title: Tofu brouillé et patate douce rôtie
  meta: {country: US, slots: [breakfast, lunch, dinner], time: [10, 30], level: 1, spice: 0, equipment: [four, poele], keeps: 2}
  items: [[tofu, 150, protein], [sweet_potato, 150, starch], [spinach, 50, veg], [olive_oil, 6, fat], [turmeric, 0.5, flavor], [paprika, 1, flavor]]
  steps:
  - Rôtir la patate douce en cubes avec la moitié de l'huile et le paprika 25 minutes à 210 °C.
  - Émietter le tofu dans le reste d'huile avec le curcuma, ajouter les épinards.
  - Servir ensemble.

