          [olive_oil, 6, fat], [turmeric, 0.5, flavor]]
  steps:
  - Faire revenir l'oignon et le poivron dans l'huile.
  - Émietter le tofu dans la poêle avec le curcuma, ajouter les épinards.
  - Cuire 5 minutes et servir avec le pain grillé.

