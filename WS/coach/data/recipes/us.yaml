- id: us_smoothie_bowl
  title: Smoothie bowl aux fruits rouges
  meta: {country: US, slots: [breakfast], time: [5, 5], level: 1, spice: 0, equipment: [mixeur], keeps: 0}
  items: [[soy_yogurt, 150, protein], [oats, 30, starch], [berries_frozen, 100, fruit], [banana, 80, fruit], [chia, 10, fat], [almonds, 10, fat]]
  steps:
  - Mixer le yaourt au soja avec les fruits rouges surgelés et la moitié de la banane.
  - Verser dans un bol et garnir du reste de banane, des flocons, du chia et des amandes.

- id: us_tofu_scramble
  title: Tofu brouillé aux légumes et pain complet
  meta: {country: US, slots: [breakfast, lunch, dinner], time: [10, 15], level: 1, spice: 0, equipment: [poele], keeps: 1}
