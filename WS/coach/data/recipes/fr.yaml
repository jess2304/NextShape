  - Accompagner d'une poignée d'amandes.

- id: fr_tartine_chevre
  title: Tartine de chèvre frais et tomates cerises
  meta: {country: FR, slots: [snack], time: [3, 3], level: 1, spice: 0, equipment: [aucun], keeps: 0, cautions: [pregnancy]}
  items: [[goat_cheese, 30, protein], [bread_whole, 30, starch], [cherry_tomato, 60, veg], [black_pepper, 0.1, flavor]]
  steps:
  - Tartiner le pain de chèvre frais.
  - Ajouter les tomates cerises coupées en deux et un tour de moulin à poivre.

- id: fr_compote_yaourt
  title: Yaourt, compote de pommes et flocons d'avoine
  meta: {country: FR, slots: [snack], time: [2, 2], level: 1, spice: 0, equipment: [aucun], keeps: 0}
  items: [[yogurt, 125, protein], [oats, 15, starch], [applesauce, 100, fruit]]
  steps:
  - Verser le yaourt dans un bol et ajouter la compote.
  - Parsemer de flocons d'avoine.

- id: fr_oeuf_radis
  title: Œufs durs, radis et pain complet
  meta: {country: FR, slots: [snack], time: [10, 12], level: 1, spice: 0, equipment: [casserole], keeps: 2}
  items: [[egg, 100, protein], [bread_whole, 30, starch], [radish, 100, veg], [salt, 0.3, flavor]]
  steps:
  - Cuire les œufs 9 minutes dans l'eau bouillante, puis les refroidir.
  - Servir avec les radis, une pincée de sel et le pain.

- id: fr_coq_au_vin
  title: Coq au vin et pommes vapeur
  meta: {country: FR, slots: [lunch, dinner], time: [30, 100], level: 2, spice: 0, equipment: [cocotte, vapeur], keeps: 3, freezes: true, leftovers: true}
  items: [[chicken_thigh, 150, protein], [potato, 220, starch], [mushroom, 80, veg], [carrot, 60, veg], [onion, 50, veg], [wine_red, 100, sauce],
          [bacon, 15, flavor], [flour, 5, flavor], [olive_oil, 6, fat], [garlic, 5, flavor], [thyme, 0.5, flavor], [bay_leaf, 0.2, flavor]]
  steps:
  - Dorer le poulet et les lardons dans l'huile, en cocotte, puis saupoudrer de farine.
  - Ajouter l'oignon, l'ail, les carottes, le thym et le laurier, puis mouiller avec le vin et un peu d'eau.
  - Couvrir et mijoter 50 minutes, en ajoutant les champignons 15 minutes avant la fin.
  - Cuire les pommes de terre à la vapeur et les servir avec le poulet et sa sauce.
  tip: Le vin s'évapore en grande partie à la cuisson ; remplacez-le par du bouillon pour une version sans alcool.

- id: fr_endives_jambon
  title: Endives au jambon gratinées et pommes de terre
  meta: {country: FR, slots: [lunch, dinner], time: [25, 60], level: 1, spice: 0, equipment: [four, casserole], keeps: 2, leftovers: true}
  items: [[ham, 60, protein], [emmental, 25, protein], [potato, 150, starch], [endive, 240, veg], [milk, 150, sauce],
          [flour, 12, flavor], [butter, 8, fat], [nutmeg, 0.2, flavor]]
  steps:
  - Cuire les endives 15 minutes à l'eau, puis bien les égoutter.
  - Préparer une béchamel avec le beurre, la farine et le lait, assaisonnée de muscade.
  - Rouler chaque endive dans une tranche de jambon, napper de béchamel et parsemer d'emmental.
  - Gratiner 20 minutes au four à 200 °C et servir avec les pommes de terre cuites à l'eau.

- id: fr_saucisse_lentilles
  title: Saucisses aux lentilles et aux carottes
  meta: {country: FR, slots: [lunch, dinner], time: [15, 45], level: 1, spice: 0, equipment: [casserole, poele], keeps: 3, freezes: true, leftovers: true}
  items: [[sausage, 100, protein], [lentils_green, 70, protein], [carrot, 80, veg], [onion, 50, veg], [olive_oil, 5, fat],
          [garlic, 4, flavor], [mustard, 5, flavor], [thyme, 0.5, flavor], [bay_leaf, 0.2, flavor]]
  steps:
  - Cuire les lentilles 25 minutes dans trois fois leur volume d'eau avec l'oignon, l'ail, les carottes, le thym et le laurier.
  - Dorer les saucisses à la poêle dans l'huile 15 minutes à feu moyen.
  - Égoutter les lentilles, les assaisonner avec la moutarde et servir avec les saucisses.

- id: fr_brandade_morue
  title: Brandade de morue et salade verte
  meta: {country: FR, slots: [lunch, dinner], time: [30, 60], level: 2, spice: 0, equipment: [four, casserole], keeps: 2, freezes: true, leftovers: true}
  items: [[salt_cod, 70, protein], [potato, 200, starch], [lettuce, 70, veg], [milk, 80, sauce], [olive_oil, 15, fat],
          [garlic, 6, flavor], [parsley, 4, flavor]]
  steps:
  - Faire dessaler la morue 24 heures à l'avance en changeant l'eau trois ou quatre fois.
  - Pocher la morue 10 minutes dans le lait frémissant, puis l'effeuiller.
  - Cuire les pommes de terre et les écraser avec la morue, l'ail, le persil, l'huile et le lait de cuisson.
  - Gratiner 15 minutes au four à 200 °C et servir avec la salade.
  tip: Pensez à mettre la morue à dessaler la veille.

- id: fr_quiche_lorraine
  title: Quiche lorraine et salade verte
  meta: {country: FR, slots: [lunch, dinner], time: [25, 70], level: 2, spice: 0, equipment: [four, poele], keeps: 2, freezes: true, leftovers: true}
  items: [[egg, 75, protein], [bacon, 40, protein], [flour, 50, starch], [lettuce, 70, veg], [butter, 25, fat], [cream, 50, sauce],
          [milk, 50, sauce], [nutmeg, 0.2, flavor]]
  steps:
  - Mélanger la farine, le beurre en dés, une pincée de sel et 2 cuillères à soupe d'eau froide ; laisser reposer la pâte 20 minutes.
  - Étaler la pâte dans un moule et faire revenir les lardons à sec.
  - Battre les œufs avec la crème, le lait et la muscade, puis verser sur les lardons répartis dans le fond de tarte.
  - Cuire 35 minutes au four à 180 °C, jusqu'à ce que la quiche soit bien prise, et servir avec la salade.

- id: fr_poulet_moutarde
  title: Poulet à la moutarde, riz et haricots verts
  meta: {country: FR, slots: [lunch, dinner], time: [15, 30], level: 1, spice: 0, equipment: [poele, casserole], keeps: 2, leftovers: true}
  items: [[chicken_breast, 140, protein], [rice, 70, starch], [green_beans, 150, veg], [onion, 30, veg], [cream, 40, sauce],
          [mustard, 15, flavor], [olive_oil, 5, fat], [thyme, 0.5, flavor]]
  steps:
  - Cuire le riz et les haricots verts à l'eau salée.
  - Dorer le poulet en lanières dans l'huile avec l'oignon émincé et le thym.
  - Ajouter la crème et la moutarde, laisser réduire 3 minutes et servir avec le riz et les haricots.

- id: fr_filet_mignon_pruneaux
  title: Filet mignon aux pruneaux et purée maison
  meta: {country: FR, slots: [lunch, dinner], time: [20, 50], level: 2, spice: 0, equipment: [cocotte, casserole], keeps: 2, leftovers: true}
  items: [[pork_tenderloin, 140, protein], [potato, 220, starch], [prunes, 30, fruit], [onion, 40, veg], [milk, 60, sauce],
          [butter, 8, fat], [olive_oil, 5, fat], [thyme, 0.5, flavor]]
  steps:
  - Dorer le filet mignon sur toutes ses faces dans l'huile, en cocotte, avec l'oignon.
  - Ajouter les pruneaux, le thym et 15 cl d'eau ; couvrir et cuire 25 minutes à feu doux.
  - Cuire les pommes de terre à l'eau et les écraser avec le lait chaud et le beurre.
  - Trancher la viande et la servir avec la purée et la sauce aux pruneaux.

- id: fr_hachis_lentilles
  title: Hachis parmentier végétal aux lentilles
  meta: {country: FR, slots: [lunch, dinner], time: [25, 60], level: 1, spice: 0, equipment: [four, casserole], keeps: 3, freezes: true, leftovers: true}
  items: [[lentils_green, 70, protein], [potato, 250, starch], [carrot, 80, veg], [onion, 60, veg], [tomato_paste, 15, sauce],
          [olive_oil, 15, fat], [garlic, 4, flavor], [thyme, 0.5, flavor], [nutmeg, 0.2, flavor]]
  steps:
  - Cuire les lentilles 25 minutes avec les carottes en dés, l'oignon, l'ail et le thym, puis les égoutter.
  - Mélanger les lentilles avec le concentré de tomate.
  - Cuire les pommes de terre et les écraser avec l'huile, un peu d'eau de cuisson et la muscade.
  - Étaler les lentilles dans un plat, couvrir de purée et gratiner 20 minutes au four à 200 °C.

- id: fr_truite_amandes
  title: Truite aux amandes, pommes vapeur et haricots verts
  meta: {country: FR, slots: [lunch, dinner], time: [15, 30], level: 1, spice: 0, equipment: [poele, vapeur], keeps: 0}
  items: [[trout, 140, protein], [potato, 200, starch], [green_beans, 120, veg], [almonds, 15, fat], [butter, 8, fat],
          [lemon_juice, 10, flavor], [parsley, 4, flavor]]
  steps:
  - Cuire les pommes de terre et les haricots verts à la vapeur, 20 minutes.
  - Dorer la truite 3 minutes par face dans le beurre.
  - Faire griller les amandes effilées dans la même poêle, puis ajouter le citron et le persil.
  - Napper la truite des amandes et servir avec les légumes.

- id: fr_chou_farci
  title: Chou farci au bœuf et au riz
  meta: {country: FR, slots: [lunch, dinner], time: [40, 100], level: 2, spice: 0, equipment: [cocotte, casserole], keeps: 3, freezes: true, leftovers: true}
  items: [[beef_mince, 100, protein], [egg, 25, protein], [rice, 40, starch], [savoy_cabbage, 200, veg], [carrot, 60, veg], [onion, 40, veg],
          [tomato_passata, 100, sauce], [olive_oil, 6, fat], [thyme, 0.5, flavor], [nutmeg, 0.2, flavor]]
  steps:
  - Blanchir les grandes feuilles de chou 5 minutes à l'eau bouillante, puis les égoutter.
  - Mélanger la viande, le riz cru, l'œuf, l'oignon haché, le thym et la muscade.
  - Garnir les feuilles de farce, les rouler et les ranger serrées dans la cocotte avec les carottes.
  - Ajouter l'huile, la sauce tomate et 30 cl d'eau ; couvrir et cuire 50 minutes à feu doux.

- id: fr_salade_lyonnaise
  title: Salade lyonnaise, œuf poché, lardons et croûtons
  meta: {country: FR, slots: [lunch, dinner], time: [15, 20], level: 2, spice: 0, equipment: [poele, casserole], keeps: 0, cautions: [pregnancy]}
  items: [[egg, 100, protein], [bacon, 40, protein], [bread_country, 50, starch], [lettuce, 100, veg], [shallot, 15, veg],
          [olive_oil, 10, fat], [vinegar, 8, flavor], [mustard, 5, flavor]]
  steps:
  - Faire dorer les lardons à sec, puis les croûtons de pain dans la graisse rendue.
  - Préparer la vinaigrette avec la moutarde, le vinaigre, l'huile et l'échalote hachée.
  - Pocher les œufs 3 minutes dans une eau frémissante vinaigrée.
  - Dresser la salade avec les lardons, les croûtons et les œufs pochés, le jaune encore coulant.

- id: fr_piperade
  title: Piperade aux œufs brouillés et pommes de terre sautées
  meta: {country: FR, slots: [lunch, dinner], time: [20, 45], level: 1, spice: 1, equipment: [poele, cocotte], keeps: 1}
  items: [[egg, 100, protein], [ham, 40, protein], [potato, 180, starch], [bell_pepper_red, 120, veg], [bell_pepper_green, 100, veg],
          [tomato, 150, veg], [onion, 60, veg], [olive_oil, 12, fat], [garlic, 5, flavor], [espelette, 0.5, flavor]]
  steps:
  - Faire fondre l'oignon et les poivrons en lanières dans une partie de l'huile, en cocotte, 15 minutes.
  - Ajouter l'ail, les tomates concassées et le piment d'Espelette ; cuire 10 minutes.
  - Faire sauter les pommes de terre en cubes dans le reste de l'huile et réchauffer le jambon.
  - Brouiller les œufs dans la piperade jusqu'à ce qu'ils soient bien cuits, puis servir avec les pommes de terre et le jambon.

- id: fr_salade_chevre_chaud
  title: Salade de chèvre chaud, noix et miel
  meta: {country: FR, slots: [lunch, dinner], time: [10, 15], level: 1, spice: 0, equipment: [four], keeps: 0}
  items: [[goat_cheese, 60, protein], [bread_country, 60, starch], [lettuce, 80, veg], [cherry_tomato, 80, veg], [walnuts, 15, fat],
          [olive_oil, 8, fat], [honey, 8, flavor], [vinegar, 5, flavor]]
  steps:
  - Poser le chèvre sur les tranches de pain et ajouter un filet de miel.
  - Passer 6 minutes au four à 200 °C, jusqu'à ce que le fromage soit chaud et doré.
  - Assaisonner la salade et les tomates avec l'huile et le vinaigre, puis ajouter les noix et les tartines chaudes.

- id: fr_tian_quinoa
  title: Tian provençal au chèvre et quinoa
  meta: {country: FR, slots: [lunch, dinner], time: [20, 65], level: 1, spice: 0, equipment: [four, casserole], keeps: 3, leftovers: true}
  items: [[goat_cheese, 40, protein], [quinoa, 60, starch], [zucchini, 150, veg], [eggplant, 120, veg], [tomato, 150, veg], [onion, 40, veg],
          [olive_oil, 12, fat], [garlic, 4, flavor], [herbes_provence, 1, flavor]]
  steps:
  - Couper les légumes en rondelles fines et les disposer en rangs serrés dans un plat, sur l'oignon émincé.
  - Arroser d'huile, parsemer d'ail et d'herbes de Provence ; cuire 45 minutes au four à 180 °C.
  - Cuire le quinoa 12 minutes à l'eau salée.
  - Émietter le chèvre sur le tian 5 minutes avant la fin et servir avec le quinoa.

- id: fr_navarin_agneau
  title: Navarin d'agneau aux légumes nouveaux
  meta: {country: FR, slots: [lunch, dinner], time: [25, 90], level: 2, spice: 0, equipment: [cocotte], keeps: 3, freezes: true, leftovers: true}
  items: [[lamb_shoulder, 130, protein], [potato, 180, starch], [carrot, 80, veg], [turnip, 60, veg], [peas, 60, veg], [onion, 40, veg],
          [tomato_paste, 15, sauce], [flour, 5, flavor], [olive_oil, 6, fat], [thyme, 0.5, flavor], [bay_leaf, 0.2, flavor]]
  steps:
  - Dorer l'agneau en morceaux dans l'huile, puis saupoudrer de farine.
  - Ajouter l'oignon, le concentré de tomate, le thym, le laurier et 50 cl d'eau ; mijoter 40 minutes à couvert.
  - Ajouter les carottes, les navets et les pommes de terre ; cuire 25 minutes.
  - Ajouter les petits pois 5 minutes avant la fin.

- id: fr_tartines_confiture
  title: Tartines beurre-confiture et bol de lait
  meta: {country: FR, slots: [breakfast], time: [5, 5], level: 1, spice: 0, equipment: [aucun], keeps: 0}
  items: [[milk, 250, protein], [bread_baguette, 80, starch], [butter, 10, fat], [jam, 25, flavor]]
  steps:
  - Couper la baguette en deux dans l'épaisseur.
  - Tartiner de beurre et de confiture, puis servir avec le lait chaud ou froid.

- id: fr_oeufs_brouilles
  title: Œufs brouillés, tartine de pain complet et tomate
  meta: {country: FR, slots: [breakfast], time: [10, 10], level: 1, spice: 0, equipment: [poele], keeps: 0}
  items: [[egg, 100, protein], [bread_whole, 60, starch], [tomato, 100, veg], [butter, 5, fat], [chives, 2, flavor]]
  steps:
  - Battre les œufs et les cuire à feu doux dans le beurre en remuant, jusqu'à ce qu'ils soient bien pris.
  - Parsemer de ciboulette et servir avec le pain grillé et la tomate en tranches.

- id: fr_clafoutis_abricots
  title: Clafoutis aux abricots
  meta: {country: FR, slots: [snack], time: [10, 45], level: 1, spice: 0, equipment: [four], keeps: 2}
  items: [[apricot, 120, fruit], [egg, 30, protein], [milk, 60, sauce], [flour, 15, starch], [sugar, 10, flavor]]
  steps:
  - Fouetter l'œuf avec le sucre, puis ajouter la farine et le lait.
  - Disposer les abricots coupés en deux dans un petit plat et verser la pâte.
  - Cuire 30 minutes au four à 180 °C.

- id: fr_porridge_quinoa
  title: Porridge de quinoa au lait d'amande et fruits rouges
  meta: {country: FR, slots: [breakfast], time: [5, 20], level: 1, spice: 0, equipment: [casserole], keeps: 2}
  items: [[quinoa, 50, starch], [almond_drink, 250, sauce], [berries_frozen, 100, fruit], [almonds, 10, fat], [maple_syrup, 10, flavor]]
  steps:
  - Rincer le quinoa et le cuire 15 minutes à feu doux dans la boisson aux amandes, en remuant de temps en temps.
  - Servir tiède avec les fruits rouges, les amandes concassées et le sirop d'érable.

- id: fr_yaourt_grec_fruits_noix
  title: Yaourt à la grecque, pomme, noix et miel
  meta: {country: FR, slots: [breakfast], time: [5, 5], level: 1, spice: 0, equipment: [aucun], keeps: 0}
  items: [[greek_yogurt, 150, protein], [apple, 120, fruit], [walnuts, 15, fat], [honey, 10, flavor]]
  steps:
  - Couper la pomme en petits dés.
  - Servir sur le yaourt avec les noix concassées et un filet de miel.
