# Ingredients used by the coach recipes.
#
# Each entry links a stable identifier to a food of the Ciqual 2025 table
# (Anses, doi:10.57745/RDMHWY). Recipe weights are given in the stated state
# (raw, dry, canned = drained, cooked, ready = ready to eat, frozen).
# Names and labels are French: they are shown to users.
#
# Fields:
#   name       displayed name
#   ciqual     Ciqual food code
#   state      state in which the food is weighed
#   aisle      shopping-list aisle
#   animal     animal origin: poultry, beef, veal, pork, lamb, fish,
#              crustacean, mollusc, egg, dairy, honey
#   allergens  plant allergens (animal ones are deduced from `animal`)
#   nut        precise tree nut (fine-grained exclusion)
#   cereal     precise gluten cereal (fine-grained exclusion)
#   families   families used for dislikes
#   unit       kitchen measure [label, grams]
#   buy        purchase pack [label, grams]
#   ratio      cooked weight / weighed weight, for display
#   liquid     displayed in centilitres
#   spicy      hot ingredient
#   lactose    false for aged cheeses and butter
#   alcohol    contains alcohol
#   approx     approximated composition: reason shown to users
#   buy_factor purchase weight / edible weight (shellfish)

